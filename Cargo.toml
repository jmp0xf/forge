[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Forge contributors"]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.5"
clap = { version = "=4.6.4", features = ["derive"] }
clap_complete = "=4.6.7"
ctrlc = "=3.5.2"
fs2 = "=0.4.3"
ignore = "=0.4.25"
nix = { version = "=0.31.3", features = ["event", "process", "signal"] }
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
