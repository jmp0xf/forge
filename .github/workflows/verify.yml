name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation:
        description: Run the bounded cargo-mutants campaign
        required: false
        default: false
        type: boolean
      performance:
        description: Measure v0 targets with the 100000-file fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_AUTO_INSTALL: "0"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mutation }}-${{ inputs.performance }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Root and fuzz project contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check pinned stable formatting
        run: cargo +stable fmt --all -- --check
      - name: Check root workspace
        run: cargo +stable check --locked --workspace --all-targets
      - name: Reject root lint warnings
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Test root workspace
        run: cargo +stable test --locked --workspace --no-fail-fast
      - name: Check fuzz formatting
        working-directory: fuzz
        run: cargo +stable fmt --all -- --check
      - name: Check fuzz workspace
        working-directory: fuzz
        run: cargo +stable check --locked --all-targets
      - name: Test fuzz workspace
        working-directory: fuzz
        run: cargo +stable test --locked --no-fail-fast
      - name: Lint fuzz workspace (advisory)
        continue-on-error: true
        working-directory: fuzz
        run: cargo +stable clippy --locked --all-targets
      - name: Measure v0 performance targets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance }}
        run: >-
          cargo +stable test --locked --release -p forge-cli --test fixture_matrix
          large_repository_v0_latency_benchmark
          -- --ignored --exact --nocapture

  generated-contract:
    name: Schemas / generated drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check checked-in schemas
        run: cargo +stable run --locked -p xtask -- check-schemas
      - name: Check generated fixtures
        run: cargo +stable run --locked -p xtask -- check-fixtures
      - name: Reject generated or untracked drift
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Smoke bootstrap CLI
        run: cargo +stable run --locked -p forge-cli -- version

  msrv:
    name: Rust 1.85 (MSRV)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check root workspace
        run: cargo +1.85.0 check --locked --workspace --all-targets
      - name: Test root workspace
        run: cargo +1.85.0 test --locked --workspace --no-fail-fast
      - name: Check schemas on MSRV
        run: cargo +1.85.0 run --locked -p xtask -- check-schemas
      - name: Check generated fixtures on MSRV
        run: cargo +1.85.0 run --locked -p xtask -- check-fixtures
      - name: Reject MSRV-generated drift
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Check fuzz workspace on MSRV
        working-directory: fuzz
        run: cargo +1.85.0 check --locked --all-targets
      - name: Test fuzz workspace on MSRV
        working-directory: fuzz
        run: cargo +1.85.0 test --locked --no-fail-fast

  unified-verify:
    name: Unified project verification / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Fetch the locked five-target dependency closure
        run: cargo +stable fetch --locked
      - name: Check reviewed release-license integration contracts
        run: |
          cargo +stable test --locked -p xtask release::tests::scoped_release_graph_counts_and_errno_targets_are_frozen -- --ignored --exact
          cargo +stable test --locked -p xtask release::tests::checked_in_release_license_evidence_is_deterministic_and_generate_is_explicit -- --ignored --exact
      - name: Run the project-owned verification entry point
        run: cargo +stable run --locked -p xtask -- verify

  native:
    name: Native stable / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: forge-0.1.0-rc.2-x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: forge-0.1.0-rc.2-aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: forge-0.1.0-rc.2-x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: forge-0.1.0-rc.2-aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: forge-0.1.0-rc.2-x86_64-pc-windows-msvc.exe
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install target
        run: rustup target add ${{ matrix.target }} --toolchain stable
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Check root workspace
        run: cargo +stable check --locked --workspace --all-targets --target ${{ matrix.target }}
      - name: Lint root workspace
        run: cargo +stable clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test root workspace
        run: cargo +stable test --locked --workspace --target ${{ matrix.target }} --no-fail-fast
      - name: Build release assembler
        run: cargo +stable build --locked --offline -p xtask
      - name: Build and execute release candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/forge-dist"
          mkdir -p "$dist"
          target/debug/xtask release-build --target "${{ matrix.target }}" --output-dir "$dist"
          chmod +x "$dist/${{ matrix.asset }}"
          "$dist/${{ matrix.asset }}" version
      - name: Build and execute Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = Join-Path $env:RUNNER_TEMP "forge-dist"
          $privateObservationDirectory = Join-Path $env:RUNNER_TEMP "forge-private-build-input"
          if ((Test-Path -LiteralPath $dist) -or (Test-Path -LiteralPath $privateObservationDirectory)) {
            throw "release candidate output roots must be fresh"
          }
          New-Item -ItemType Directory -Path $dist | Out-Null
          New-Item -ItemType Directory -Path $privateObservationDirectory | Out-Null

          function Get-CanonicalUtf16Bytes {
            param([object]$Encoded, [string]$Label)
            if (($Encoded -isnot [string]) -or [string]::IsNullOrEmpty($Encoded)) {
              throw "$Label is not a non-empty Base64 string"
            }
            try {
              [byte[]]$Bytes = [Convert]::FromBase64String($Encoded)
            } catch {
              throw "$Label is not valid Base64"
            }
            if (($Bytes.Length -eq 0) -or ($Bytes.Length -gt 65532) -or (($Bytes.Length % 2) -ne 0)) {
              throw "$Label has an invalid decoded length"
            }
            if ([Convert]::ToBase64String($Bytes) -cne $Encoded) {
              throw "$Label is not canonical Base64"
            }
            for ($Index = 0; $Index -lt $Bytes.Length; $Index += 2) {
              if (($Bytes[$Index] -eq 0) -and ($Bytes[$Index + 1] -eq 0)) {
                throw "$Label contains a NUL code unit"
              }
            }
            return ,$Bytes
          }

          try {
            & .\target\debug\xtask.exe release-build `
              --target "${{ matrix.target }}" `
              --output-dir $dist `
              --build-input-observation-dir $privateObservationDirectory
            $BuildExitCode = $LASTEXITCODE

            $ObservationName = "release-build-input-observation-${{ matrix.target }}.json"
            $ObservationPath = Join-Path $privateObservationDirectory $ObservationName
            if (-not (Test-Path -LiteralPath $ObservationPath -PathType Leaf)) {
              if ($BuildExitCode -ne 0) {
                throw "release-build failed before observation creation with exit code $BuildExitCode"
              }
              throw "release-build did not create its private observation"
            }
            $ObservationEntries = @(Get-ChildItem -LiteralPath $privateObservationDirectory -Force)
            if (($ObservationEntries.Count -ne 1) -or ($ObservationEntries[0].Name -cne $ObservationName)) {
              throw "private observation directory does not contain exactly the fixed file"
            }
            $ObservationFile = Get-Item -LiteralPath $ObservationPath -Force
            if ($ObservationFile.PSIsContainer -or
                (($ObservationFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or
                ($ObservationFile.Length -le 0) -or ($ObservationFile.Length -gt 524288)) {
              throw "private observation is not one bounded non-reparse regular file"
            }

            try {
              [byte[]]$ObservationBytes = [IO.File]::ReadAllBytes($ObservationPath)
              $StrictUtf8 = [Text.UTF8Encoding]::new($false, $true)
              $Observation = $StrictUtf8.GetString($ObservationBytes) | ConvertFrom-Json -Depth 16
            } catch {
              throw "private observation is not strict UTF-8 JSON"
            }
            if ($Observation.schema -cne "forge.release-build-input-observation/v1" -or
                $Observation.purpose -cne "diagnostic-only-not-release-evidence" -or
                $Observation.phase -cne "after-environment-preparation-before-cargo-release-build" -or
                $Observation.target -cne "x86_64-pc-windows-msvc") {
              throw "private observation has an unexpected contract identity"
            }

            $SourceObjectFormat = ((& git rev-parse --show-object-format) -join "").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "failed to read the source object format"
            }
            $SourceOid = ((& git rev-parse HEAD) -join "").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "failed to read the source commit"
            }
            if (($Observation.source_commit.object_format -cne $SourceObjectFormat) -or
                ($Observation.source_commit.oid -cne $SourceOid)) {
              throw "private observation is not bound to the checked-out source commit"
            }

            $ObservedArguments = @($Observation.cargo_command.arguments)
            if ($ObservedArguments.Count -ne 13) {
              throw "private observation has an unexpected Cargo argument count"
            }
            $NativeValues = @($Observation.cargo_command.program)
            $NativeValues += $ObservedArguments
            $NativeValues += @($Observation.cargo_command.working_directory)
            if ($NativeValues.Count -ne 15) {
              throw "private observation omitted a Cargo invocation value"
            }
            foreach ($Value in $NativeValues) {
              if ($Value.encoding -cne "windows-wide") {
                throw "Cargo invocation value does not use Windows-native encoding"
              }
              $null = Get-CanonicalUtf16Bytes $Value.raw_base64 "Cargo invocation value"
            }

            if ($Observation.windows_msvc_environment.status -cne "observed") {
              throw "private observation omitted the prepared MSVC environment"
            }
            foreach ($Name in @("path", "lib", "include")) {
              $Value = $Observation.windows_msvc_environment.$Name
              if ($Value.encoding -cne "windows-utf16le-base64") {
                throw "prepared MSVC $Name uses an unexpected encoding"
              }
              $null = Get-CanonicalUtf16Bytes $Value.raw_base64 "prepared MSVC $Name"
            }
            if ($BuildExitCode -ne 0) {
              throw "release-build failed after observation creation with exit code $BuildExitCode"
            }

            $DistEntries = @(Get-ChildItem -LiteralPath $dist -Force)
            $ExpectedAssetNames = @("${{ matrix.asset }}", "${{ matrix.asset }}.cdx.json") | Sort-Object
            $ActualAssetNames = @($DistEntries | ForEach-Object {
              if ($_.PSIsContainer -or (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
                throw "release output contains a non-regular entry"
              }
              $_.Name
            }) | Sort-Object
            if (($ActualAssetNames.Count -ne 2) -or
                (($ActualAssetNames -join "`n") -cne ($ExpectedAssetNames -join "`n"))) {
              throw "release output does not contain exactly the binary and SBOM"
            }

            & (Join-Path $dist "${{ matrix.asset }}") version
            if ($LASTEXITCODE -ne 0) {
              throw "release candidate execution failed with exit code $LASTEXITCODE"
            }
          } finally {
            if (Test-Path -LiteralPath $privateObservationDirectory) {
              Remove-Item -LiteralPath $privateObservationDirectory -Recurse -Force
            }
          }

  adapters:
    name: Host adapter contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test adapter unit contracts
        run: cargo +stable test --locked -p forge-cli --bin forge adapter
      - name: Test adapter CLI contracts
        run: cargo +stable test --locked -p forge-cli --test cli_contract adapter
      - name: Test adapter fixture boundaries
        run: cargo +stable test --locked -p forge-cli --test fixture_matrix adapter
      - name: Test adapter human output
        run: cargo +stable test --locked -p forge-cli --test human_golden adapter

  self-hosting:
    name: Repository dogfood fixed point
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test repository fixed point
        run: cargo +stable test --locked -p forge-cli --test dogfood_fixed_point --no-fail-fast

  authority-boundary:
    name: Candidate authority boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test architecture and compatibility boundaries
        run: >-
          cargo +stable test --locked -p xtask
          --test architecture_invariants
          --test compatibility_harness
          --no-fail-fast

  strict-exitability:
    name: Strict fixture exitability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install fixed Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install fixed fixture runners
        shell: bash
        run: |
          cargo +stable install --locked just --version 1.50.0
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Record fixture runner versions
        shell: bash
        run: |
          rustc +stable --version --verbose
          cargo +stable --version --verbose
          go version
          just --version
          task --version
          make --version
      - name: Run strict release fixture matrix
        run: >-
          cargo +stable test --locked -p forge-cli --test fixture_matrix
          every_declared_native_command_survives_fixture_install_and_uninstall_for_release
          -- --ignored --exact --nocapture

  fuzz:
    name: Fuzz critical boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-07-26 --profile minimal --component rust-src
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-26 install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz critical boundaries for 60 seconds each
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            parse_status_porcelain_v2 \
            merge_managed_block \
            parse_forge_config \
            roundtrip_native_path
          do
            output="$RUNNER_TEMP/fuzz-corpus/$target"
            mkdir -p "$output"
            cargo +nightly-2026-07-26 fuzz run "$target" \
              "$output" "$GITHUB_WORKSPACE/fuzz/corpus/$target" -- \
              -max_total_time=60 -timeout=10 -print_final_stats=1 -verbosity=0
          done
          if [[ -d fuzz/artifacts ]] && find fuzz/artifacts -type f -print -quit | grep -q .
          then
            echo "fuzz campaign produced a crash artifact" >&2
            exit 1
          fi

  mutation:
    name: Bounded mutation campaign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-mutants
        run: cargo +stable install --locked cargo-mutants --version 27.0.0
      - name: Run checked-in mutation surface
        run: cargo +stable mutants
