[package]
name = "xtask"
description = "Forge repository development tasks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "xtask"

[dependencies]
base64.workspace = true
blake3.workspace = true
forge-core = { path = "../crates/forge-core" }
forge-schema = { path = "../crates/forge-schema" }
forge-runtime = { path = "../crates/forge-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
find-msvc-tools.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_yaml_ng.workspace = true

[[bin]]
name = "xtask-compat-fixture"
path = "tests/support/compat_fixture.rs"
test = false
bench = false

[lints]
workspace = true
